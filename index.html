*{box-sizing:border-box}
body{margin:0;font-family:Onest,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}

.sos{background:var(--red);color:#fff;position:sticky;top:0;z-index:5}

.sos b{font-size:.95rem}

.menu{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);padding:22px 0 30px}
@media (min-width:640px){.menu{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:18px 10px;text-align:center;text-decoration:none;color:var(--ink);font-weight:700;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:112px;cursor:pointer;font:inherit;font-weight:700}
.tile span{font-size:2.3rem;line-height:1}
.tile:hover{background:var(--gold);color:#10265e}
.tile.red{border-color:var(--red)}
.view{padding:18px 0 40px}
.back{display:inline-flex;gap:6px;align-items:center;background:none;border:2px solid var(--ink);color:var(--ink);border-radius:99px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer;margin-bottom:14px}
.view h2{margin:0 0 14px;font-size:1.7rem}
details{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:1.4rem;color:var(--teal)}
details[open] summary::after{content:"–"}
details .in{padding:0 16px 14px}
details ul{margin:0;padding-left:20px}
details li{margin-bottom:5px}
.lab{font-weight:700;color:var(--teal)}
.call{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.call b{font-size:1.8rem;color:var(--red);min-width:64px}
.call small{display:block;color:var(--muted)}
.call i{font-style:normal;background:var(--red);color:#fff;border-radius:99px;padding:6px 14px;font-weight:700}
.hosp{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.hosp small{color:var(--muted);display:block}
.go{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.go a{flex:1;min-width:96px;text-align:center;text-decoration:none;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);color:var(--ink);background:var(--bg)}
.go a.main{background:var(--teal);border-color:var(--teal);color:#06302e}
.go a:hover{background:var(--gold);border-color:var(--gold);color:#10265e}
.note{background:var(--paper);border:1px dashed var(--teal);border-radius:12px;padding:10px 14px;margin-bottom:14px;color:var(--muted);font-size:.95rem}
footer{background:var(--cobalt);color:#cfdcf7;padding:20px 0;text-align:center;font-size:.9rem}
[hidden]{display:none!important}
</style>

}
function route(){
  var k=location.hash.slice(1);
  if(!D[k]){$('view').hidden=true;$('menu').hidden=false;document.title='AqylTour: Түркістанға қауіпсіз саяхат';return}
  $('menu').hidden=true;var v=$('view');v.hidden=false;
  v.innerHTML='<a class="back" href="#">← Басты бет</a><h2>'+D[k].e+' '+D[k].t+'</h2>'+body(k);
  document.title=D[k].t+' · AqylTour';window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);menu();route();
</script>
</body>
</html>
